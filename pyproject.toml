[project]
name = "trabajo-final-aya101"
version = "0.1.0"
description = "Trabajo final: extracción de variables RCV desde historias clínicas con Aya-101 (Transformer encoder-decoder)"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pymupdf>=2.1",
    "streamlit>=1.67.0",
    "torch>=2.14.1",
    "transformers>=5.24.0",
]

# PyTorch con CUDA 12.6, igual que el entorno uv del curso
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
